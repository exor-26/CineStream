# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE override project settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Do not hard-code org.gradle.java.home here. Android Studio can use its bundled JBR locally,
# while CI and other contributors can supply any compatible JDK 17+ installation.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
