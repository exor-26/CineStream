name: Validate capability fallback core

on:
  push:
    branches:
      - fix/capability-aware-video-fallback
    paths:
      - '.github/workflows/validate-video-fallback-core.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-aware-video-fallback
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Run unit tests and compile release
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
