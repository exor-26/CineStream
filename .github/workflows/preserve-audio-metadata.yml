name: Validate audio metadata preservation

on:
  push:
    branches: [fix/audio-metadata-preserve]
    paths:
      - '.github/workflows/preserve-audio-metadata.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audio-metadata-preserve
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Preserve stronger existing metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/cinestream/VideoAdapter.java')
          text = p.read_text()

          old_details = "                snapshot.allAudioTrackDetails.clear();\n                snapshot.allAudioTrackDetails.addAll(media3.trackDetails);\n                snapshot.audioDetailsLabel = media3.multiLineDetails();"
          new_details = "                boolean existingDetailsWeak = snapshot.allAudioTrackDetails.isEmpty()\n                        || \"Unknown\".equals(snapshot.audioDetailsLabel)\n                        || \"Audio track present\".equals(snapshot.audioDetailsLabel);\n                boolean inspectorFillsMissingTechnicalData =\n                        (snapshot.primaryAudioChannels <= 0 && media3.primaryChannelCount > 0)\n                                || (snapshot.primaryAudioSampleRate <= 0\n                                && media3.primarySampleRate > 0);\n\n                // Use inspector descriptions only when they improve incomplete platform metadata.\n                if (existingDetailsWeak || inspectorFillsMissingTechnicalData) {\n                    snapshot.allAudioTrackDetails.clear();\n                    snapshot.allAudioTrackDetails.addAll(media3.trackDetails);\n                    snapshot.audioDetailsLabel = media3.multiLineDetails();\n                }"
          if text.count(old_details) != 1:
              raise SystemExit(f'Expected one details block, found {text.count(old_details)}')
          text = text.replace(old_details, new_details, 1)

          old_codec = "                if (media3.primaryCodecLabel != null && !media3.primaryCodecLabel.isEmpty()) {\n                    snapshot.audioCodecLabel = media3.primaryCodecLabel;\n                }"
          new_codec = "                if (media3.primaryCodecLabel != null\n                        && !media3.primaryCodecLabel.isEmpty()\n                        && !\"Audio\".equals(media3.primaryCodecLabel)) {\n                    snapshot.audioCodecLabel = media3.primaryCodecLabel;\n                }"
          if text.count(old_codec) != 1:
              raise SystemExit(f'Expected one codec block, found {text.count(old_codec)}')
          text = text.replace(old_codec, new_codec, 1)

          old_scalars = "                snapshot.primaryAudioChannels = media3.primaryChannelCount;\n                snapshot.primaryAudioSampleRate = media3.primarySampleRate;"
          new_scalars = "                if (media3.primaryChannelCount > 0) {\n                    snapshot.primaryAudioChannels = media3.primaryChannelCount;\n                }\n                if (media3.primarySampleRate > 0) {\n                    snapshot.primaryAudioSampleRate = media3.primarySampleRate;\n                }"
          if text.count(old_scalars) != 1:
              raise SystemExit(f'Expected one scalar block, found {text.count(old_scalars)}')
          p.write_text(text.replace(old_scalars, new_scalars, 1))
          PY

      - name: Test and build release
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify arm64 package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdav1dJNI.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvpxV2JNI.so'

      - name: Commit validated hardening
        shell: bash
        run: |
          git rm .github/workflows/preserve-audio-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/cinestream/VideoAdapter.java
          git commit -m 'Preserve stronger existing audio metadata'
          git push origin HEAD:fix/audio-metadata-preserve
