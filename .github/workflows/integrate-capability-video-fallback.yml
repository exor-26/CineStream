name: Validate and integrate capability-aware video fallback

on:
  push:
    branches:
      - fix/capability-aware-video-fallback
    paths:
      - '.github/workflows/integrate-capability-video-fallback.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: fix/capability-aware-video-fallback
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Wire player recovery
        run: |
          python3 scripts/patch_capability_player.py
          git diff --check
          grep -q 'shouldRetryWithSoftwareVideo' app/src/main/java/com/example/cinestream/VideoPlayerActivity.java
          grep -q 'MergingMediaSource' app/src/main/java/com/example/cinestream/VideoPlayerActivity.java
          grep -q 'CompatibilityVideoTranscoder.start' app/src/main/java/com/example/cinestream/VideoPlayerActivity.java

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build optimized release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify arm64 release packaging and native alignment
        shell: bash
        run: |
          set -euo pipefail
          ARM64_APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          if [ -z "$ARM64_APK" ]; then
            echo "arm64-v8a release APK not found"
            find app/build/outputs/apk -type f -maxdepth 5 -print || true
            exit 1
          fi

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found"
            exit 1
          fi

          "$ZIPALIGN" -c -P 16 -v 4 "$ARM64_APK"

          NATIVE_DIR="$(mktemp -d)"
          unzip -q "$ARM64_APK" 'lib/arm64-v8a/*.so' -d "$NATIVE_DIR"
          python3 - "$NATIVE_DIR" <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          libraries = sorted(root.rglob('*.so'))
          if not libraries:
              raise SystemExit('No arm64 native libraries found in release APK')

          bad = []
          for library in libraries:
              output = subprocess.check_output(
                  ['readelf', '-lW', str(library)],
                  text=True,
                  errors='replace',
              )
              alignments = []
              for line in output.splitlines():
                  fields = line.split()
                  if fields and fields[0] == 'LOAD':
                      try:
                          alignments.append(int(fields[-1], 16))
                      except ValueError:
                          pass
              minimum = min(alignments) if alignments else 0
              print(f'{library.name}: minimum LOAD alignment = 0x{minimum:x}')
              if minimum < 0x4000:
                  bad.append((library.name, minimum))

          if bad:
              details = ', '.join(f'{name}=0x{alignment:x}' for name, alignment in bad)
              raise SystemExit('Native libraries below 16 KiB ELF alignment: ' + details)
          PY

      - name: Commit validated player wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/cinestream/VideoPlayerActivity.java
          git rm scripts/patch_capability_player.py
          git rm .github/workflows/validate-video-fallback-core.yml
          git rm .github/workflows/integrate-capability-video-fallback.yml
          git commit -m 'Wire capability-aware video recovery'
          git push origin HEAD:fix/capability-aware-video-fallback
