      - name: Run tests and builds
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify arm64 release packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdav1dJNI.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvpxV2JNI.so'

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-multitrack-subtitle-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/cinestream/VideoAdapter.java \
                  app/src/main/java/com/example/cinestream/VideoPlayerActivity.java \
                  app/src/main/java/com/example/cinestream/Media3AudioMetadataProbe.java \
                  app/src/main/java/com/example/cinestream/DetailedAudioFormatter.java \
