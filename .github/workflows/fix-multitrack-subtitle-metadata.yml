name: Validate multitrack audio and subtitle metadata fixes

on:
  push:
    branches: [fix/multitrack-subtitle-metadata]
    paths:
      - '.github/workflows/fix-multitrack-subtitle-metadata.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multitrack-subtitle-metadata
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Wire per-track metadata into UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once('app/src/main/java/com/example/cinestream/VideoAdapter.java', '        List<String> allAudioTrackDetails = new ArrayList<>();\n', '        List<String> allAudioTrackDetails = new ArrayList<>();\n        List<String> platformAudioCodecs = new ArrayList<>();\n        List<Integer> platformAudioChannels = new ArrayList<>();\n        List<Integer> platformAudioSampleRates = new ArrayList<>();\n')
          replace_once('app/src/main/java/com/example/cinestream/VideoAdapter.java', '                String trackDetail = parts.isEmpty() ? "Audio track" : TextUtils.join(" • ", parts);\n                snapshot.allAudioTrackDetails.add(trackDetail);\n\n                if ("Unknown".equals(snapshot.audioCodecLabel)) {\n', '                String trackDetail = parts.isEmpty() ? "Audio track" : TextUtils.join(" • ", parts);\n                snapshot.allAudioTrackDetails.add(trackDetail);\n                snapshot.platformAudioCodecs.add(codecLabel);\n                snapshot.platformAudioChannels.add(ch);\n                snapshot.platformAudioSampleRates.add(hz);\n\n                if ("Unknown".equals(snapshot.audioCodecLabel)) {\n')

          old = '        // Detailed Info uses Media3\'s own extractor stack first. This is the same parser family\n        // used by playback and exposes per-track language, codec, channel count and sample rate\n        // more consistently than the platform MediaExtractor for formats such as E-AC-3.\n        if (allowFfmpegFallback) {\n            Media3AudioMetadataProbe.Result media3 =\n                    Media3AudioMetadataProbe.probe(context, videoFile.getContentUri());\n            if (media3.hasAudioTracks()) {\n                boolean existingDetailsWeak = snapshot.allAudioTrackDetails.isEmpty()\n                        || "Unknown".equals(snapshot.audioDetailsLabel)\n                        || "Audio track present".equals(snapshot.audioDetailsLabel);\n                boolean inspectorFillsMissingTechnicalData =\n                        (snapshot.primaryAudioChannels <= 0 && media3.primaryChannelCount > 0)\n                                || (snapshot.primaryAudioSampleRate <= 0\n                                && media3.primarySampleRate > 0);\n\n                // Use inspector descriptions only when they improve incomplete platform metadata.\n                if (existingDetailsWeak || inspectorFillsMissingTechnicalData) {\n                    snapshot.allAudioTrackDetails.clear();\n                    snapshot.allAudioTrackDetails.addAll(media3.trackDetails);\n                    snapshot.audioDetailsLabel = media3.multiLineDetails();\n                }\n                if (media3.primaryCodecLabel != null\n                        && !media3.primaryCodecLabel.isEmpty()\n                        && !"Audio".equals(media3.primaryCodecLabel)) {\n                    snapshot.audioCodecLabel = media3.primaryCodecLabel;\n                }\n                if (media3.primaryChannelCount > 0) {\n                    snapshot.primaryAudioChannels = media3.primaryChannelCount;\n                }\n                if (media3.primarySampleRate > 0) {\n                    snapshot.primaryAudioSampleRate = media3.primarySampleRate;\n                }\n            }\n        }\n'
          new = '        // Enumerate every audio track with Media3, then fill only missing technical\n        // fields from the platform extractor when both parsers report the same track count.\n        if (allowFfmpegFallback) {\n            Media3AudioMetadataProbe.Result media3 =\n                    Media3AudioMetadataProbe.probe(context, videoFile.getContentUri());\n            if (media3.hasAudioTracks()) {\n                media3.enrichMissingFromPlatform(\n                        snapshot.platformAudioCodecs,\n                        snapshot.platformAudioChannels,\n                        snapshot.platformAudioSampleRates);\n                snapshot.allAudioTrackDetails.clear();\n                snapshot.allAudioTrackDetails.addAll(media3.detailLines());\n                snapshot.audioCodecLabel = media3.multiLineCodecs();\n                snapshot.audioDetailsLabel = media3.multiLineDetails();\n                DetailedAudioFormatter.Track primary = media3.primaryTrack();\n                if (primary != null) {\n                    if (primary.channelCount > 0) snapshot.primaryAudioChannels = primary.channelCount;\n                    if (primary.sampleRate > 0) snapshot.primaryAudioSampleRate = primary.sampleRate;\n                }\n            }\n        }\n'
          replace_once('app/src/main/java/com/example/cinestream/VideoAdapter.java', old, new)
          replace_once('app/src/main/java/com/example/cinestream/VideoAdapter.java', '        rows.add(new GlassUi.InfoItem("Audio codec",     snapshot.audioCodecLabel));\n', '        rows.add(new GlassUi.InfoItem("Audio codecs",    snapshot.audioCodecLabel));\n')

          old = '    private ArrayList<GlassUi.ActionItem> buildSubtitleActions(List<Tracks.Group> subtitleGroups) {\n        ArrayList<GlassUi.ActionItem> actions = new ArrayList<>();\n        boolean subtitleEnabled = isTextTrackEnabled();\n        actions.add(new GlassUi.ActionItem(\n                ACTION_SUBTITLE_OFF,\n                "Off",\n                subtitleEnabled ? "Disable captions" : "Currently off"\n        ));\n\n        for (int i = 0; i < subtitleGroups.size(); i++) {\n            TrackGroup trackGroup = subtitleGroups.get(i).getMediaTrackGroup();\n            for (int j = 0; j < trackGroup.length; j++) {\n                Format format = trackGroup.getFormat(j);\n                String title = buildTrackTitle("Caption", j, format.language, format.label);\n                String subtitle = buildSubtitleTrackSubtitle(format, subtitleGroups.get(i).isTrackSupported(j));\n                if (subtitleGroups.get(i).isTrackSelected(j) && subtitleEnabled) {\n                    subtitle = "Selected" + (subtitle.isEmpty() ? "" : " • " + subtitle);\n                }\n                actions.add(new GlassUi.ActionItem(i * 100 + j, title, subtitle));\n            }\n        }\n        return actions;\n    }\n'
          new = '    private ArrayList<GlassUi.ActionItem> buildSubtitleActions(List<Tracks.Group> subtitleGroups) {\n        ArrayList<GlassUi.ActionItem> actions = new ArrayList<>();\n        boolean subtitleEnabled = isTextTrackEnabled();\n        actions.add(new GlassUi.ActionItem(\n                ACTION_SUBTITLE_OFF,\n                "Off",\n                subtitleEnabled ? "Disable captions" : "Currently off"\n        ));\n\n        int ordinal = 1;\n        for (int i = 0; i < subtitleGroups.size(); i++) {\n            TrackGroup trackGroup = subtitleGroups.get(i).getMediaTrackGroup();\n            for (int j = 0; j < trackGroup.length; j++) {\n                Format format = trackGroup.getFormat(j);\n                String title = SubtitleTrackFormatter.buildTitle(ordinal++, format);\n                String subtitle = SubtitleTrackFormatter.buildTechnicalDetails(\n                        format, subtitleGroups.get(i).isTrackSupported(j));\n                if (subtitleGroups.get(i).isTrackSelected(j) && subtitleEnabled) {\n                    subtitle = "Selected" + (subtitle.isEmpty() ? "" : " • " + subtitle);\n                }\n                actions.add(new GlassUi.ActionItem(i * 100 + j, title, subtitle));\n            }\n        }\n        return actions;\n    }\n'
          replace_once('app/src/main/java/com/example/cinestream/VideoPlayerActivity.java', old, new)
          PY

      - name: Run tests and builds
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify arm64 release packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          test -n "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdav1dJNI.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvpxV2JNI.so'

      - name: Commit validated UI wiring
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-multitrack-subtitle-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/cinestream/VideoAdapter.java app/src/main/java/com/example/cinestream/VideoPlayerActivity.java
          git commit -m 'Wire per-track audio and subtitle metadata'
          git push origin HEAD:fix/multitrack-subtitle-metadata
