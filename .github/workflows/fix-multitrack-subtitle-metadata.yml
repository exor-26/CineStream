name: Validate multitrack audio and subtitle metadata fixes

on:
  push:
    branches: [fix/multitrack-subtitle-metadata]
    paths:
      - '.github/workflows/fix-multitrack-subtitle-metadata.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/multitrack-subtitle-metadata
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Apply metadata fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Detailed Info needs per-track fallback metadata so Media3 can fill gaps without
          # discarding channel/rate values that the platform extractor did expose.
          replace_once(
              'app/src/main/java/com/example/cinestream/VideoAdapter.java',
              '''        List<String> allAudioTrackDetails = new ArrayList<>();\n''',
              '''        List<String> allAudioTrackDetails = new ArrayList<>();\n        List<String> platformAudioCodecs = new ArrayList<>();\n        List<Integer> platformAudioChannels = new ArrayList<>();\n        List<Integer> platformAudioSampleRates = new ArrayList<>();\n'''
          )

          replace_once(
              'app/src/main/java/com/example/cinestream/VideoAdapter.java',
              '''                String trackDetail = parts.isEmpty() ? "Audio track" : TextUtils.join(" • ", parts);\n                snapshot.allAudioTrackDetails.add(trackDetail);\n\n                if ("Unknown".equals(snapshot.audioCodecLabel)) {\n''',
              '''                String trackDetail = parts.isEmpty() ? "Audio track" : TextUtils.join(" • ", parts);\n                snapshot.allAudioTrackDetails.add(trackDetail);\n                snapshot.platformAudioCodecs.add(codecLabel);\n                snapshot.platformAudioChannels.add(ch);\n                snapshot.platformAudioSampleRates.add(hz);\n\n                if ("Unknown".equals(snapshot.audioCodecLabel)) {\n'''
          )

          old_media3 = '''        // Detailed Info uses Media3's own extractor stack first. This is the same parser family\n        // used by playback and exposes per-track language, codec, channel count and sample rate\n        // more consistently than the platform MediaExtractor for formats such as E-AC-3.\n        if (allowFfmpegFallback) {\n            Media3AudioMetadataProbe.Result media3 =\n                    Media3AudioMetadataProbe.probe(context, videoFile.getContentUri());\n            if (media3.hasAudioTracks()) {\n                boolean existingDetailsWeak = snapshot.allAudioTrackDetails.isEmpty()\n                        || "Unknown".equals(snapshot.audioDetailsLabel)\n                        || "Audio track present".equals(snapshot.audioDetailsLabel);\n                boolean inspectorFillsMissingTechnicalData =\n                        (snapshot.primaryAudioChannels <= 0 && media3.primaryChannelCount > 0)\n                                || (snapshot.primaryAudioSampleRate <= 0\n                                && media3.primarySampleRate > 0);\n\n                // Use inspector descriptions only when they improve incomplete platform metadata.\n                if (existingDetailsWeak || inspectorFillsMissingTechnicalData) {\n                    snapshot.allAudioTrackDetails.clear();\n                    snapshot.allAudioTrackDetails.addAll(media3.trackDetails);\n                    snapshot.audioDetailsLabel = media3.multiLineDetails();\n                }\n                if (media3.primaryCodecLabel != null\n                        && !media3.primaryCodecLabel.isEmpty()\n                        && !"Audio".equals(media3.primaryCodecLabel)) {\n                    snapshot.audioCodecLabel = media3.primaryCodecLabel;\n                }\n                if (media3.primaryChannelCount > 0) {\n                    snapshot.primaryAudioChannels = media3.primaryChannelCount;\n                }\n                if (media3.primarySampleRate > 0) {\n                    snapshot.primaryAudioSampleRate = media3.primarySampleRate;\n                }\n            }\n        }\n'''
          new_media3 = '''        // Detailed Info uses Media3's playback parser to enumerate every audio track.\n        // Platform extractor values are merged only into missing fields and only when both\n        // parsers report the same track count, preventing cross-track codec/channel mismatches.\n        if (allowFfmpegFallback) {\n            Media3AudioMetadataProbe.Result media3 =\n                    Media3AudioMetadataProbe.probe(context, videoFile.getContentUri());\n            if (media3.hasAudioTracks()) {\n                media3.enrichMissingFromPlatform(\n                        snapshot.platformAudioCodecs,\n                        snapshot.platformAudioChannels,\n                        snapshot.platformAudioSampleRates);\n\n                snapshot.allAudioTrackDetails.clear();\n                snapshot.allAudioTrackDetails.addAll(media3.detailLines());\n                snapshot.audioCodecLabel = media3.multiLineCodecs();\n                snapshot.audioDetailsLabel = media3.multiLineDetails();\n\n                DetailedAudioFormatter.Track primary = media3.primaryTrack();\n                if (primary != null) {\n                    if (primary.channelCount > 0) {\n                        snapshot.primaryAudioChannels = primary.channelCount;\n                    }\n                    if (primary.sampleRate > 0) {\n                        snapshot.primaryAudioSampleRate = primary.sampleRate;\n                    }\n                }\n            }\n        }\n'''
          replace_once('app/src/main/java/com/example/cinestream/VideoAdapter.java', old_media3, new_media3)

          replace_once(
              'app/src/main/java/com/example/cinestream/VideoAdapter.java',
              '''        rows.add(new GlassUi.InfoItem("Audio codec",     snapshot.audioCodecLabel));\n''',
              '''        rows.add(new GlassUi.InfoItem("Audio codecs",    snapshot.audioCodecLabel));\n'''
          )

          old_subtitles = '''    private ArrayList<GlassUi.ActionItem> buildSubtitleActions(List<Tracks.Group> subtitleGroups) {\n        ArrayList<GlassUi.ActionItem> actions = new ArrayList<>();\n        boolean subtitleEnabled = isTextTrackEnabled();\n        actions.add(new GlassUi.ActionItem(\n                ACTION_SUBTITLE_OFF,\n                "Off",\n                subtitleEnabled ? "Disable captions" : "Currently off"\n        ));\n\n        for (int i = 0; i < subtitleGroups.size(); i++) {\n            TrackGroup trackGroup = subtitleGroups.get(i).getMediaTrackGroup();\n            for (int j = 0; j < trackGroup.length; j++) {\n                Format format = trackGroup.getFormat(j);\n                String title = buildTrackTitle("Caption", j, format.language, format.label);\n                String subtitle = buildSubtitleTrackSubtitle(format, subtitleGroups.get(i).isTrackSupported(j));\n                if (subtitleGroups.get(i).isTrackSelected(j) && subtitleEnabled) {\n                    subtitle = "Selected" + (subtitle.isEmpty() ? "" : " • " + subtitle);\n                }\n                actions.add(new GlassUi.ActionItem(i * 100 + j, title, subtitle));\n            }\n        }\n        return actions;\n    }\n'''
          new_subtitles = '''    private ArrayList<GlassUi.ActionItem> buildSubtitleActions(List<Tracks.Group> subtitleGroups) {\n        ArrayList<GlassUi.ActionItem> actions = new ArrayList<>();\n        boolean subtitleEnabled = isTextTrackEnabled();\n        actions.add(new GlassUi.ActionItem(\n                ACTION_SUBTITLE_OFF,\n                "Off",\n                subtitleEnabled ? "Disable captions" : "Currently off"\n        ));\n\n        int ordinal = 1;\n        for (int i = 0; i < subtitleGroups.size(); i++) {\n            TrackGroup trackGroup = subtitleGroups.get(i).getMediaTrackGroup();\n            for (int j = 0; j < trackGroup.length; j++) {\n                Format format = trackGroup.getFormat(j);\n                String title = SubtitleTrackFormatter.buildTitle(ordinal++, format);\n                String subtitle = SubtitleTrackFormatter.buildTechnicalDetails(\n                        format, subtitleGroups.get(i).isTrackSupported(j));\n                if (subtitleGroups.get(i).isTrackSelected(j) && subtitleEnabled) {\n                    subtitle = "Selected" + (subtitle.isEmpty() ? "" : " • " + subtitle);\n                }\n                actions.add(new GlassUi.ActionItem(i * 100 + j, title, subtitle));\n            }\n        }\n        return actions;\n    }\n'''
          replace_once('app/src/main/java/com/example/cinestream/VideoPlayerActivity.java', old_subtitles, new_subtitles)

          Path('app/src/main/java/com/example/cinestream/DetailedAudioFormatter.java').write_text(r'''package com.example.cinestream;

import androidx.media3.common.C;

import java.util.ArrayList;
import java.util.List;
import java.util.Locale;

/** Pure formatter/merger for per-track Detailed Info audio metadata. */
final class DetailedAudioFormatter {

    static final class Track {
        final int ordinal;
        final String title;
        String codec;
        int channelCount;
        int sampleRate;
        final int selectionFlags;

        Track(int ordinal, String title, String codec, int channelCount, int sampleRate,
              int selectionFlags) {
            this.ordinal = ordinal;
            this.title = title;
            this.codec = normalizeCodec(codec);
            this.channelCount = Math.max(0, channelCount);
            this.sampleRate = Math.max(0, sampleRate);
            this.selectionFlags = selectionFlags;
        }
    }

    private DetailedAudioFormatter() {}

    static void enrichMissing(
            List<Track> tracks,
            List<String> fallbackCodecs,
            List<Integer> fallbackChannels,
            List<Integer> fallbackSampleRates
    ) {
        if (tracks == null || fallbackCodecs == null || fallbackChannels == null
                || fallbackSampleRates == null) return;
        int size = tracks.size();
        if (size == 0 || fallbackCodecs.size() != size || fallbackChannels.size() != size
                || fallbackSampleRates.size() != size) return;

        for (int i = 0; i < size; i++) {
            Track track = tracks.get(i);
            String fallbackCodec = normalizeCodec(fallbackCodecs.get(i));
            if (isWeakCodec(track.codec) && !isWeakCodec(fallbackCodec)) {
                track.codec = fallbackCodec;
            }
            int fallbackCh = safeInt(fallbackChannels.get(i));
            int fallbackHz = safeInt(fallbackSampleRates.get(i));
            if (track.channelCount <= 0 && fallbackCh > 0) track.channelCount = fallbackCh;
            if (track.sampleRate <= 0 && fallbackHz > 0) track.sampleRate = fallbackHz;
        }
    }

    static List<String> detailLines(List<Track> tracks) {
        List<String> lines = new ArrayList<>();
        if (tracks == null) return lines;
        for (Track track : tracks) lines.add(detailLine(track));
        return lines;
    }

    static String multiLineCodecs(List<Track> tracks) {
        if (tracks == null || tracks.isEmpty()) return "Unknown";
        if (tracks.size() == 1) {
            Track t = tracks.get(0);
            return t.title + " — " + t.codec;
        }
        StringBuilder sb = new StringBuilder();
        for (int i = 0; i < tracks.size(); i++) {
            Track t = tracks.get(i);
            sb.append("Track ").append(i + 1).append(": ")
                    .append(t.title).append(" — ").append(t.codec);
            if (i < tracks.size() - 1) sb.append('\n');
        }
        return sb.toString();
    }

    static String multiLineDetails(List<Track> tracks) {
        if (tracks == null || tracks.isEmpty()) return "Unknown";
        if (tracks.size() == 1) return detailLine(tracks.get(0));
        StringBuilder sb = new StringBuilder();
        for (int i = 0; i < tracks.size(); i++) {
            sb.append("Track ").append(i + 1).append(": ").append(detailLine(tracks.get(i)));
            if (i < tracks.size() - 1) sb.append('\n');
        }
        return sb.toString();
    }

    private static String detailLine(Track track) {
        List<String> parts = new ArrayList<>();
        parts.add(track.codec);
        if (track.channelCount > 0) parts.add(AudioTrackFormatter.channelLabel(track.channelCount));
        if (track.sampleRate > 0) parts.add(formatSampleRate(track.sampleRate));
        if ((track.selectionFlags & C.SELECTION_FLAG_DEFAULT) != 0) parts.add("Default");
        return track.title + " — " + String.join(" • ", parts);
    }

    private static String formatSampleRate(int sampleRate) {
        if (sampleRate >= 1000 && sampleRate % 1000 == 0) return (sampleRate / 1000) + " kHz";
        if (sampleRate >= 1000) return String.format(Locale.US, "%.1f kHz", sampleRate / 1000f);
        return sampleRate + " Hz";
    }

    private static String normalizeCodec(String codec) {
        if (codec == null || codec.trim().isEmpty()) return "Audio";
        return codec.trim();
    }

    private static boolean isWeakCodec(String codec) {
        if (codec == null) return true;
        String c = codec.trim().toLowerCase(Locale.US);
        return c.isEmpty() || "audio".equals(c) || "unknown".equals(c)
                || c.contains("unsupported") || c.contains("not reported");
    }

    private static int safeInt(Integer value) {
        return value == null ? 0 : Math.max(0, value);
    }
}
''')

          Path('app/src/main/java/com/example/cinestream/Media3AudioMetadataProbe.java').write_text(r'''package com.example.cinestream;

import android.content.Context;
import android.net.Uri;
import android.util.Log;

import androidx.media3.common.C;
import androidx.media3.common.Format;
import androidx.media3.common.MediaItem;
import androidx.media3.common.TrackGroup;
import androidx.media3.common.util.UnstableApi;
import androidx.media3.exoplayer.source.TrackGroupArray;
import androidx.media3.inspector.MetadataRetriever;

import java.util.ArrayList;
import java.util.List;
import java.util.concurrent.TimeUnit;

/** Detailed-info probe backed by Media3's own extractor stack. */
@UnstableApi
final class Media3AudioMetadataProbe {

    static final class Result {
        final List<DetailedAudioFormatter.Track> tracks = new ArrayList<>();

        boolean hasAudioTracks() {
            return !tracks.isEmpty();
        }

        void enrichMissingFromPlatform(
                List<String> codecs,
                List<Integer> channels,
                List<Integer> sampleRates
        ) {
            DetailedAudioFormatter.enrichMissing(tracks, codecs, channels, sampleRates);
        }

        List<String> detailLines() {
            return DetailedAudioFormatter.detailLines(tracks);
        }

        String multiLineCodecs() {
            return DetailedAudioFormatter.multiLineCodecs(tracks);
        }

        String multiLineDetails() {
            return DetailedAudioFormatter.multiLineDetails(tracks);
        }

        DetailedAudioFormatter.Track primaryTrack() {
            DetailedAudioFormatter.Track first = null;
            for (DetailedAudioFormatter.Track track : tracks) {
                if (first == null) first = track;
                if ((track.selectionFlags & C.SELECTION_FLAG_DEFAULT) != 0) return track;
            }
            return first;
        }
    }

    private Media3AudioMetadataProbe() {}

    static Result probe(Context context, Uri uri) {
        Result result = new Result();
        MediaItem item = MediaItem.fromUri(uri);

        try (MetadataRetriever retriever = new MetadataRetriever.Builder(context, item).build()) {
            TrackGroupArray groups = retriever.retrieveTrackGroups().get(8, TimeUnit.SECONDS);
            int ordinal = 1;
            for (int groupIndex = 0; groupIndex < groups.length; groupIndex++) {
                TrackGroup group = groups.get(groupIndex);
                if (group.type != C.TRACK_TYPE_AUDIO) continue;
                for (int trackIndex = 0; trackIndex < group.length; trackIndex++) {
                    Format format = group.getFormat(trackIndex);
                    result.tracks.add(new DetailedAudioFormatter.Track(
                            ordinal,
                            AudioTrackFormatter.buildTitle(ordinal, format),
                            AudioTrackFormatter.codecLabel(format),
                            Math.max(0, format.channelCount),
                            Math.max(0, format.sampleRate),
                            format.selectionFlags));
                    ordinal++;
                }
            }
        } catch (Exception e) {
            Log.w("Media3MetadataProbe", "Media3 audio metadata probe failed", e);
        }
        return result;
    }
}
''')

          Path('app/src/main/java/com/example/cinestream/SubtitleTrackFormatter.java').write_text(r'''package com.example.cinestream;

import androidx.media3.common.C;
import androidx.media3.common.Format;

import java.util.ArrayList;
import java.util.List;
import java.util.Locale;
import java.util.regex.Pattern;

/** Builds stable subtitle names from semantic track metadata instead of muxer advertising labels. */
final class SubtitleTrackFormatter {
    private static final Pattern DOMAIN_PATTERN = Pattern.compile(
            "(?i).*(?:^|[^a-z0-9])(?:[a-z0-9-]+\\.)+(?:com|net|org|in|co|io|me|tv|to|xyz)(?:[^a-z0-9]|$).*"
    );

    private SubtitleTrackFormatter() {}

    static String buildTitle(int ordinal, Format format) {
        return buildTitle(ordinal, format.language, format.label, format.roleFlags, format.selectionFlags);
    }

    static String buildTitle(
            int ordinal,
            String languageCode,
            String rawLabel,
            int roleFlags,
            int selectionFlags
    ) {
        String language = displayLanguage(languageCode);
        String role = roleLabel(roleFlags, selectionFlags);
        String cleanLabel = cleanHumanLabel(rawLabel);

        if (language != null) {
            return role == null ? language : language + " • " + role;
        }
        if (cleanLabel != null) {
            return role == null || containsIgnoreCase(cleanLabel, role)
                    ? cleanLabel : cleanLabel + " • " + role;
        }
        return role == null
                ? "Caption " + Math.max(1, ordinal)
                : "Caption " + Math.max(1, ordinal) + " • " + role;
    }

    static String buildTechnicalDetails(Format format, boolean supported) {
        return buildTechnicalDetails(
                format.sampleMimeType,
                format.selectionFlags,
                supported);
    }

    static String buildTechnicalDetails(String mime, int selectionFlags, boolean supported) {
        List<String> parts = new ArrayList<>();
        parts.add(codecLabel(mime));
        if ((selectionFlags & C.SELECTION_FLAG_DEFAULT) != 0) parts.add("Default");
        if ((selectionFlags & C.SELECTION_FLAG_FORCED) != 0) parts.add("Forced");
        if (!supported) parts.add("Limited");
        return String.join(" • ", parts);
    }

    static String codecLabel(String mime) {
        if (mime == null || mime.trim().isEmpty()) return "Subtitle";
        switch (mime) {
            case "application/x-subrip": return "SRT";
            case "text/x-ssa": return "ASS/SSA";
            case "text/vtt":
            case "application/x-mp4-vtt": return "WebVTT";
            case "application/ttml+xml": return "TTML";
            case "application/x-quicktime-tx3g": return "TX3G";
            case "application/pgs": return "PGS";
            case "application/dvbsubs": return "DVB";
            case "application/cea-608":
            case "application/x-mp4-cea-608": return "CEA-608";
            case "application/cea-708": return "CEA-708";
            case "application/vobsub": return "VobSub";
            default:
                String value = mime.replace("application/", "").replace("text/", "");
                return value.isEmpty() ? "Subtitle" : value.toUpperCase(Locale.US);
        }
    }

    private static String roleLabel(int roleFlags, int selectionFlags) {
        if ((selectionFlags & C.SELECTION_FLAG_FORCED) != 0) return "Forced";
        boolean music = (roleFlags & C.ROLE_FLAG_DESCRIBES_MUSIC_AND_SOUND) != 0;
        boolean dialog = (roleFlags & C.ROLE_FLAG_TRANSCRIBES_DIALOG) != 0;
        if (music && dialog) return "SDH";
        if ((roleFlags & C.ROLE_FLAG_CAPTION) != 0) return "Captions";
        if ((roleFlags & C.ROLE_FLAG_SIGN) != 0) return "Sign";
        if ((roleFlags & C.ROLE_FLAG_EASY_TO_READ) != 0) return "Easy read";
        if ((roleFlags & C.ROLE_FLAG_COMMENTARY) != 0) return "Commentary";
        if (music) return "Sound descriptions";
        if (dialog) return "Dialogue";
        if ((roleFlags & C.ROLE_FLAG_MAIN) != 0) return "Main";
        return null;
    }

    private static String displayLanguage(String language) {
        if (language == null) return null;
        String value = language.trim();
        if (value.isEmpty() || "und".equalsIgnoreCase(value)) return null;
        Locale locale = Locale.forLanguageTag(value.replace('_', '-'));
        String display = locale.getDisplayLanguage(Locale.ENGLISH);
        if (display != null && !display.trim().isEmpty() && !display.equalsIgnoreCase(value)) {
            return capitalize(display.trim());
        }
        return value.toUpperCase(Locale.US);
    }

    private static String cleanHumanLabel(String label) {
        if (label == null) return null;
        String value = label.trim().replaceAll("\\s+", " ");
        if (value.isEmpty()) return null;
        String lower = value.toLowerCase(Locale.US);
        if (lower.startsWith("http://") || lower.startsWith("https://")
                || lower.startsWith("www.") || lower.contains("t.me/")
                || DOMAIN_PATTERN.matcher(value).matches()) return null;
        if (lower.contains("telegram") || lower.contains("download from")
                || lower.contains("visit our") || lower.contains("join our")
                || lower.contains("website:")) return null;
        return value.length() > 80 ? null : value;
    }

    private static boolean containsIgnoreCase(String value, String part) {
        return value.toLowerCase(Locale.US).contains(part.toLowerCase(Locale.US));
    }

    private static String capitalize(String value) {
        if (value.isEmpty()) return value;
        return value.substring(0, 1).toUpperCase(Locale.ENGLISH) + value.substring(1);
    }
}
''')

          Path('app/src/test/java/com/example/cinestream/DetailedAudioFormatterTest.java').write_text(r'''package com.example.cinestream;

import androidx.media3.common.C;

import org.junit.Test;

import java.util.Arrays;
import java.util.List;

import static org.junit.Assert.assertEquals;
import static org.junit.Assert.assertTrue;

public class DetailedAudioFormatterTest {
    @Test
    public void multipleTracksKeepCodecAndTechnicalDataPaired() {
        List<DetailedAudioFormatter.Track> tracks = Arrays.asList(
                new DetailedAudioFormatter.Track(1, "English", "E-AC-3", 6, 48000,
                        C.SELECTION_FLAG_DEFAULT),
                new DetailedAudioFormatter.Track(2, "Hindi", "AAC", 2, 44100, 0));

        String codecs = DetailedAudioFormatter.multiLineCodecs(tracks);
        String details = DetailedAudioFormatter.multiLineDetails(tracks);

        assertTrue(codecs.contains("Track 1: English — E-AC-3"));
        assertTrue(codecs.contains("Track 2: Hindi — AAC"));
        assertTrue(details.contains("English — E-AC-3 • 5.1 (6 ch) • 48 kHz • Default"));
        assertTrue(details.contains("Hindi — AAC • Stereo (2 ch) • 44.1 kHz"));
    }

    @Test
    public void platformFallbackOnlyFillsMissingValues() {
        List<DetailedAudioFormatter.Track> tracks = Arrays.asList(
                new DetailedAudioFormatter.Track(1, "English", "E-AC-3", 6, 48000, 0),
                new DetailedAudioFormatter.Track(2, "Hindi", "Audio", 0, 0, 0));

        DetailedAudioFormatter.enrichMissing(
                tracks,
                Arrays.asList("AAC", "DTS-HD"),
                Arrays.asList(2, 8),
                Arrays.asList(44100, 96000));

        assertEquals("E-AC-3", tracks.get(0).codec);
        assertEquals(6, tracks.get(0).channelCount);
        assertEquals(48000, tracks.get(0).sampleRate);
        assertEquals("DTS-HD", tracks.get(1).codec);
        assertEquals(8, tracks.get(1).channelCount);
        assertEquals(96000, tracks.get(1).sampleRate);
    }
}
''')

          Path('app/src/test/java/com/example/cinestream/SubtitleTrackFormatterTest.java').write_text(r'''package com.example.cinestream;

import androidx.media3.common.C;

import org.junit.Test;

import static org.junit.Assert.assertEquals;
import static org.junit.Assert.assertFalse;

public class SubtitleTrackFormatterTest {
    @Test
    public void languageBeatsAdvertisingMuxerLabel() {
        String title = SubtitleTrackFormatter.buildTitle(
                1, "en", "www.randomsite.com", 0, 0);
        assertEquals("English", title);
        assertFalse(title.toLowerCase().contains("randomsite"));
    }

    @Test
    public void advertisingLabelWithoutLanguageFallsBackToOrdinal() {
        assertEquals("Caption 2", SubtitleTrackFormatter.buildTitle(
                2, null, "Join our Telegram t.me/example", 0, 0));
    }

    @Test
    public void forcedAndSdhRolesComeFromMetadata() {
        assertEquals("English • Forced", SubtitleTrackFormatter.buildTitle(
                1, "en", "garbage", 0, C.SELECTION_FLAG_FORCED));
        assertEquals("Hindi • SDH", SubtitleTrackFormatter.buildTitle(
                2, "hi", null,
                C.ROLE_FLAG_DESCRIBES_MUSIC_AND_SOUND | C.ROLE_FLAG_TRANSCRIBES_DIALOG, 0));
    }

    @Test
    public void subtitleTypeAndFlagsAreReadable() {
        assertEquals("SRT • Default", SubtitleTrackFormatter.buildTechnicalDetails(
                "application/x-subrip", C.SELECTION_FLAG_DEFAULT, true));
        assertEquals("ASS/SSA • Forced • Limited", SubtitleTrackFormatter.buildTechnicalDetails(
                "text/x-ssa", C.SELECTION_FLAG_FORCED, false));
    }
}
''')
