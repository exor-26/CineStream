name: Validate audio metadata fixes

on:
  push:
    branches: [fix/audio-metadata]
    paths:
      - '.github/workflows/fix-audio-metadata.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/audio-metadata
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Wire normalized track labels and Media3 inspector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/build.gradle',
              '    implementation "androidx.media3:media3-ui:$media3_version"\n',
              '    implementation "androidx.media3:media3-ui:$media3_version"\n'
              '    implementation "androidx.media3:media3-inspector:$media3_version"\n'
          )

          replace_once(
              'app/src/main/java/com/example/cinestream/VideoPlayerActivity.java',
              '''                Format format = trackGroup.getFormat(j);\n                String title = buildTrackTitle("Track", j, format.language, format.label);\n                String subtitle = buildAudioTrackSubtitle(format, audioGroups.get(i).isTrackSupported(j));\n''',
              '''                Format format = trackGroup.getFormat(j);\n                int ordinal = actions.size() + 1;\n                String title = AudioTrackFormatter.buildTitle(ordinal, format);\n                String subtitle = AudioTrackFormatter.buildTechnicalDetails(\n                        format, audioGroups.get(i).isTrackSupported(j));\n'''
          )

          replace_once(
              'app/src/main/java/com/example/cinestream/VideoAdapter.java',
              '''        // FFmpeg metadata probing is kept out of normal row binding because some files trigger\n        // a native crash in the retriever library during fast RecyclerView rebinding.\n        if (allowFfmpegFallback && shouldUseFfmpegFallback(videoFile, snapshot)) {\n            fillUnknownsWithFfmpeg(videoFile, snapshot);\n        }\n''',
              '''        // Detailed Info uses Media3's own extractor stack first. This is the same parser family\n        // used by playback and exposes per-track language, codec, channel count and sample rate\n        // more consistently than the platform MediaExtractor for formats such as E-AC-3.\n        if (allowFfmpegFallback) {\n            Media3AudioMetadataProbe.Result media3 =\n                    Media3AudioMetadataProbe.probe(context, videoFile.getContentUri());\n            if (media3.hasAudioTracks()) {\n                snapshot.allAudioTrackDetails.clear();\n                snapshot.allAudioTrackDetails.addAll(media3.trackDetails);\n                snapshot.audioDetailsLabel = media3.multiLineDetails();\n                if (media3.primaryCodecLabel != null && !media3.primaryCodecLabel.isEmpty()) {\n                    snapshot.audioCodecLabel = media3.primaryCodecLabel;\n                }\n                snapshot.primaryAudioChannels = media3.primaryChannelCount;\n                snapshot.primaryAudioSampleRate = media3.primarySampleRate;\n            }\n        }\n\n        // FFmpeg remains a fallback for metadata Media3/platform extractors cannot resolve. It is\n        // kept out of normal row binding because some files trigger native work/crashes there.\n        if (allowFfmpegFallback && shouldUseFfmpegFallback(videoFile, snapshot)) {\n            fillUnknownsWithFfmpeg(videoFile, snapshot);\n        }\n'''
          )
          PY

      - name: Run tests and release build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Verify reduced arm64 release
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          test -n "$APK"
          echo "Validated APK: $APK"
          ls -lh "$APK"

          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libdav1dJNI.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvpxJNI.so'

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-audio-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
                  app/src/main/java/com/example/cinestream/VideoPlayerActivity.java \
                  app/src/main/java/com/example/cinestream/VideoAdapter.java \
                  app/src/main/java/com/example/cinestream/AudioTrackFormatter.java \
                  app/src/main/java/com/example/cinestream/Media3AudioMetadataProbe.java \
                  app/src/test/java/com/example/cinestream/AudioTrackFormatterTest.java
          git commit -m 'Improve audio track names and detailed metadata'
          git push origin HEAD:fix/audio-metadata
