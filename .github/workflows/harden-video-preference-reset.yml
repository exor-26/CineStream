name: Validate hardware-first reset hardening

on:
  push:
    branches:
      - fix/capability-aware-video-fallback
    paths:
      - '.github/workflows/harden-video-preference-reset.yml'

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capability-aware-video-fallback
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Apply reset hardening
        run: |
          python3 scripts/patch_video_preference_reset.py
          git diff --check
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Validate tests and optimized release
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - name: Verify arm64 release packaging
        shell: bash
        run: |
          set -euo pipefail
          ARM64_APK="$(find app/build/outputs/apk -type f -name '*arm64-v8a*release*.apk' | head -n 1)"
          test -n "$ARM64_APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -P 16 -v 4 "$ARM64_APK"
      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/cinestream/VideoPlayerActivity.java
          git rm scripts/patch_video_preference_reset.py
          git rm .github/workflows/harden-video-preference-reset.yml
          git commit -m 'Reset software video preference between items'
          git push origin HEAD:fix/capability-aware-video-fallback
