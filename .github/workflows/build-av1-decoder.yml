name: Build Media3 AV1 Decoder

on:
  push:
    branches: [phase4/player-engine]
    paths:
      - '.github/workflows/build-av1-decoder.yml'

jobs:
  build-av1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CineStream
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build python3-pip
          python3 -m pip install --user 'meson>=0.63,<2'
          sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone Media3 1.9.4
        run: git clone --depth 1 --branch 1.9.4 https://github.com/androidx/media.git media3-src

      - name: Build dav1d native libraries
        shell: bash
        run: |
          set -euo pipefail
          MEDIA3_DIR="$GITHUB_WORKSPACE/media3-src"
          AV1_MODULE_PATH="$MEDIA3_DIR/libraries/decoder_av1/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          HOST_PLATFORM="linux-x86_64"

          cd "$AV1_MODULE_PATH/jni"
          git clone --depth 1 https://github.com/google/cpu_features.git
          git clone --depth 1 https://code.videolan.org/videolan/dav1d.git

          ./build_dav1d.sh "$AV1_MODULE_PATH" "$NDK_PATH" "$HOST_PLATFORM"

      - name: Build Media3 AV1 release AAR
        shell: bash
        run: |
          set -euo pipefail
          cd media3-src
          chmod +x gradlew
          ./gradlew :lib-decoder-av1:bundleReleaseAar --stacktrace

      - name: Inspect native alignment
        shell: bash
        run: |
          set -euo pipefail
          AAR="$(find media3-src -type f -name '*.aar' -path '*decoder_av1*' | head -n 1)"
          if [ -z "$AAR" ]; then
            echo 'AV1 decoder AAR was not found. Available AARs:'
            find media3-src -type f -name '*.aar' -print || true
            exit 1
          fi

          echo "Validating $AAR"
          TMP="$(mktemp -d)"
          unzip -q "$AAR" 'jni/*/*.so' -d "$TMP"
          python3 - "$TMP" <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(sys.argv[1])
          libs = sorted(root.rglob('*.so'))
          if not libs:
              raise SystemExit('No native libraries in AV1 AAR')

          bad = []
          for lib in libs:
              out = subprocess.check_output(['readelf', '-lW', str(lib)], text=True)
              aligns = []
              for line in out.splitlines():
                  fields = line.split()
                  if fields and fields[0] == 'LOAD':
                      aligns.append(int(fields[-1], 16))
              minimum = min(aligns) if aligns else 0
              print(f'{lib}: minimum LOAD alignment = 0x{minimum:x}')
              if minimum < 0x4000:
                  bad.append((str(lib), minimum))
          if bad:
              raise SystemExit('AV1 native library is not 16 KiB compatible: ' + repr(bad))
          PY

          ls -lh "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/media3-decoder-av1-1.9.4.aar"

      - name: Upload AV1 decoder AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-av1-1.9.4
          path: media3-decoder-av1-1.9.4.aar
          if-no-files-found: error
          compression-level: 9
