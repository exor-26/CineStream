// build.gradle (Module Level)

plugins {
    id 'com.android.application'
}

def cineFfmpegVersion = "8.1.2"
def cineFfmpegRoot = file("${rootProject.projectDir}/.native/ffmpeg-${cineFfmpegVersion}")
def cineFfmpegBuildScript = file("${rootProject.projectDir}/scripts/build_ffmpeg_android.sh")

android {
    namespace 'com.example.cinestream'
    compileSdk 35
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.example.cinestream"
        minSdk 24
        //noinspection EditedTargetSdkVersion
        targetSdk 35
        versionCode 87
        versionName "9.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                arguments "-DFFMPEG_ROOT=${cineFfmpegRoot.absolutePath}"
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk false
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:deprecation']
    }
}

tasks.register('buildCineFfmpeg', Exec) {
    group = 'build'
    description = 'Builds CineStream minimal FFmpeg video decoder libraries for Android.'

    inputs.file(cineFfmpegBuildScript)
    outputs.files(
            file("${cineFfmpegRoot}/arm64-v8a/libavcodec.a"),
            file("${cineFfmpegRoot}/arm64-v8a/libavutil.a"),
            file("${cineFfmpegRoot}/armeabi-v7a/libavcodec.a"),
            file("${cineFfmpegRoot}/armeabi-v7a/libavutil.a"),
            file("${cineFfmpegRoot}/include/libavcodec/avcodec.h")
    )

    commandLine 'bash', cineFfmpegBuildScript.absolutePath, cineFfmpegRoot.absolutePath
}

// Native configure/compile tasks require the generated FFmpeg headers and static libraries.
tasks.configureEach { task ->
    if (task.name == 'preBuild'
            || task.name.startsWith('configureCMake')
            || task.name.startsWith('buildCMake')) {
        task.dependsOn tasks.named('buildCineFfmpeg')
    }
}

def media3_version = "1.9.4"

dependencies {
    // Kotlin Standard Library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    // AndroidX Libraries
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'  // For RecyclerView

    // Media3 + FFmpeg software audio decoder. Keep the Media3 modules on one version line.
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-inspector:$media3_version"
    // Compatibility-copy fallback remains only for formats outside CineStream's native video set.
    implementation "androidx.media3:media3-transformer:$media3_version"
    implementation "androidx.media3:media3-effect:$media3_version"
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"
    // Native video extensions remain after MediaCodec: hardware first, software fallback only.
    implementation files('libs/media3-decoder-av1-1.9.4.aar')
    implementation files('libs/media3-decoder-vp9-1.9.4.aar')
    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-core:1.0.21'
    implementation 'com.github.wseemann:FFmpegMediaMetadataRetriever-native:1.0.21'
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

    // Material Design Components
    implementation 'com.google.android.material:material:1.9.0'
    implementation libs.activity
    implementation 'androidx.palette:palette:1.0.0'

    // Test Libraries
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
